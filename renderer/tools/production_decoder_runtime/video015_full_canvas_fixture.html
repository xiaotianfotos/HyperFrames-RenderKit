<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #020509;
    }
    [data-composition-id] {
      position: relative;
      width: 3840px;
      height: 2160px;
      overflow: hidden;
      background: #020509;
    }
    #video015 {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      z-index: 0;
    }
    #exact-label {
      position: absolute;
      left: 120px;
      bottom: 110px;
      z-index: 1;
      box-sizing: border-box;
      padding: 34px 48px;
      border: 3px solid rgba(126, 249, 204, 0.86);
      border-radius: 24px;
      background: rgba(3, 12, 20, 0.82);
      color: #f4fffb;
      font: 700 42px/1.15 system-ui, sans-serif;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>
  <main data-composition-id="video015-production-exact"
        data-start="0" data-duration="4.5" data-width="3840" data-height="2160">
    <video id="video015" class="clip" src="media/video_015.mp4"
           data-start="0" data-duration="4.5" data-media-start="0" data-track-index="0"
           muted playsinline></video>
    <div id="exact-label" class="clip"
         data-start="0" data-duration="4.5" data-track-index="1">
      video_015 · exact PTS · production WebCodecs
    </div>
  </main>
  <script>
    window.__timelines = {
      main: {
        seek(time) {
          document.documentElement.dataset.frameTime = Number(time).toFixed(6);
        },
      },
    };
  </script>
</body>
</html>
